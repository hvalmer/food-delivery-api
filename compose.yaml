services:
  mysql:
    image: mysql:8.4
    container_name: food-delivery-mysql
    environment:
      MYSQL_DATABASE: food_delivery
      MYSQL_USER: food_delivery
      MYSQL_PASSWORD: food_delivery
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - food_delivery_mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  food_delivery_mysql_data:
    